<VirtualHost *:80>
    ServerName lojix.my.id
    ServerAlias www.lojix.my.id

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://lojix.my.id$1 [R=301,L]

    Alias /.well-known/acme-challenge/ /www/wwwroot/lojix.my.id/.well-known/acme-challenge/
</VirtualHost>

<VirtualHost *:443>
    ServerName lojix.my.id
    ServerAlias www.lojix.my.id

    SSLEngine on
    SSLCertificateFile /www/server/panel/vhost/cert/lojix.my.id/fullchain.pem
    SSLCertificateKeyFile /www/server/panel/vhost/cert/lojix.my.id/privkey.pem
    SSLProtocol TLSv1.2 TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

    LimitRequestBody 524288000

    Timeout 86400
    ProxyTimeout 86400

    ProxyRequests Off
    ProxyPreserveHost On

    <Location /live>
        ProxyPass http://127.0.0.1:18000/live.mp3 nocanon
        ProxyPassReverse http://127.0.0.1:18000/live.mp3
        Header always set Access-Control-Allow-Origin "*"
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        SetEnv proxy-sendchunks 1
        SetEnv proxy-sendcl 0
        SetEnv force-proxy-request-1.0 1
        SetEnv proxy-nokeepalive 1
        SetEnv proxy-initial-not-buffered 1
        RequestHeader unset Accept-Encoding
    </Location>

    <Location /hq>
        ProxyPass http://127.0.0.1:18000/hq.mp3 nocanon
        ProxyPassReverse http://127.0.0.1:18000/hq.mp3
        Header always set Access-Control-Allow-Origin "*"
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        SetEnv proxy-sendchunks 1
        SetEnv proxy-sendcl 0
        SetEnv force-proxy-request-1.0 1
        SetEnv proxy-nokeepalive 1
        SetEnv proxy-initial-not-buffered 1
        RequestHeader unset Accept-Encoding
    </Location>

    <Location /mobile>
        ProxyPass http://127.0.0.1:18000/mobile.mp3 nocanon
        ProxyPassReverse http://127.0.0.1:18000/mobile.mp3
        Header always set Access-Control-Allow-Origin "*"
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        SetEnv proxy-sendchunks 1
        SetEnv proxy-sendcl 0
        SetEnv force-proxy-request-1.0 1
        SetEnv proxy-nokeepalive 1
        SetEnv proxy-initial-not-buffered 1
        RequestHeader unset Accept-Encoding
    </Location>

    <Location /ws/>
        ProxyPass ws://127.0.0.1:13001/ws/
        ProxyPassReverse ws://127.0.0.1:13001/ws/
        ProxyTimeout 86400
        ProxyBadHeader Ignore
    </Location>

    <Location /socket.io/>
        ProxyPass ws://127.0.0.1:13001/socket.io/
        ProxyPassReverse ws://127.0.0.1:13001/socket.io/
        ProxyTimeout 86400
        ProxyBadHeader Ignore
    </Location>

    <Location /api/>
        ProxyPass http://127.0.0.1:13001/api/
        ProxyPassReverse http://127.0.0.1:13001/api/
        ProxyTimeout 120
        ProxyBadHeader Ignore
        Header always set Access-Control-Allow-Origin "https://lojix.my.id"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Authorization, Content-Type"
    </Location>

    <Location />
        ProxyPass http://127.0.0.1:13000/
        ProxyPassReverse http://127.0.0.1:13000/
        ProxyTimeout 60
        ProxyBadHeader Ignore
    </Location>

    ErrorLog /www/wwwlogs/lojix.my.id.error.log
    CustomLog /www/wwwlogs/lojix.my.id.access.log combined
</VirtualHost>
